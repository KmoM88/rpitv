# Configuration for RPi TV Video Player

# Player backend: "ffmpeg" (recommended for raw framebuffer)
PLAYER=ffmpeg

# Additional software rotation (true/false)
# Inverts video 180 degrees via ffmpeg (hflip,vflip)
ROTATE_180=true

# Video playback behavior
SHUFFLE=true
BALANCE_FOLDERS=true
LOOP_FOREVER=true

# Supported video extensions (comma-separated)
VIDEO_EXTENSIONS=.mp4,.mkv,.avi,.mov,.m4v,.webm,.mpg,.mpeg,.ts,.flv,.3gp

# Directories to search for video files
SCAN_DIRS=/media,/mnt
